plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.19"
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.net.terracraft'
version = '1.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io/' }
    maven { url 'https://repo.codemc.org/repository/maven-public/' }
}

dependencies {
    // Paper dev bundle — включает API + NMS
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")

    // Vault (Foulest форк) — только для компиляции
    compileOnly 'com.github.Foulest:Vault:2.5.0'

    // ConfigLib — внутрь JAR (используется в рантайме)
    implementation 'de.exlll:configlib-yaml:4.8.1'

    // CommandAPI — только для компиляции (плагин на сервере)
    compileOnly 'dev.jorel:commandapi-paper-core:12.1.0'

    // PlaceholderAPI — только для компиляции (плагин на сервере)
    compileOnly 'me.clip:placeholderapi:2.12.3'

    //compileOnly "cc.carm.plugin:minesql-api:1.4.2"

    // Update Notifier — внутрь JAR (используется в рантайме)
    implementation 'com.github.ez-plugins:mc-plugin-update-notifier:1.0.0'

    // Внутрь JAR
    implementation 'com.h2database:h2:2.3.232'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
}

def targetJavaVersion = 25

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set(' ')

    relocate 'org.bstats',           'ru.net.terracraft.eco.libs.bstats'
    relocate 'com.zaxxer.hikari',    'ru.net.terracraft.eco.libs.hikari'
    relocate 'org.h2',               'ru.net.terracraft.eco.libs.h2'
    relocate 'de.exlll.configlib',   'ru.net.terracraft.eco.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.net.terracraft.eco.libs.updater'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'

    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

build.dependsOn shadowJar