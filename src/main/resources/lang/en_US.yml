prefix: "<dark_gray>[<gold>TerrEconomy<dark_gray>] <reset>"

# Forms of the currency name for pluralization.
# en_US: 2 forms (singular for 1, plural-many for everything else).
currency:
  singular: "coin"
  plural-few: "coins"
  plural-many: "coins"

messages:
  # reserved, not used yet (all commands are executesPlayer)
  general.only-players: "<red>This command is for players only."
  general.no-permission: "<red>You don't have permission."
  general.player-not-found: "<red>Player <yellow><target></yellow> not found."
  general.player-never-joined: "<red>Player <yellow><target></yellow> has never joined the server."
  general.invalid-amount: "<red>Invalid amount."
  general.negative-amount: "<red>Amount must be positive."
  general.self-action: "<red>You cannot perform this action on yourself."
  general.rate-limit: "<red>Please wait <yellow><seconds></yellow> sec. before the next command."
  general.payconfirm: "<yellow>Confirm transfer of <white><amount> <symbol></white> to <yellow><target></yellow>. Type <white>/payconfirm</white> within <white><timeout></white> seconds."
  general.payconfirm-replaced: "<yellow>Previous request (<white><old_amount> <symbol></white> → <yellow><old_target></yellow>) cancelled. Confirm new: <white><amount> <symbol></white> → <yellow><target></yellow>. Type <white>/payconfirm</white> within <white><timeout></white> seconds."
  general.payconfirm-timeout: "<red>No active transfer or confirmation timed out."
  eco.cleanup: "<green>Removed inactive accounts: <yellow><count></yellow>"
  general.reloaded: "<green>Configuration and language files reloaded."

  # Styled format of amount with pluralized currency.
  # Usage: lang.formatCurrencyStyled(player, amount).
  currency.format: "<white><amount></white> <gray><currency></gray>"

  # reserved, not used yet (top not implemented)
  balance.self: "<gold>Your balance: <yellow><balance>"
  balance.other: "<gold>Balance of <yellow><target></yellow>: <yellow><balance>"
  balance.top-header: "<gold>=== Richest players ==="
  balance.top-line: "<yellow><rank>. <white><name> <gray>— <yellow><balance>"
  balance.top-empty: "<gray>No players in the top yet."

  pay.success-sender: "<green>You sent <yellow><amount></yellow> to <yellow><target></yellow>."
  pay.success-target: "<green>You received <yellow><amount></yellow> from <yellow><sender></yellow>."
  pay.tax-notice: "<gray>(tax: <red><tax></red>)"
  pay.offline-queued: "<yellow>Player is offline. Payment of <yellow><amount></yellow> will be delivered on join."
  pay.offline-delivered: "<green>You received a payment of <yellow><amount></yellow> from <yellow><sender></yellow>."
  pay.offline-summary: "<green>You received <yellow><count></yellow> payments totaling <yellow><total></yellow>."
  pay.insufficient-funds: "<red>Insufficient funds. Your balance: <yellow><balance>"
  pay.target-max-balance: "<red>Player <yellow><target></yellow> has reached max balance (<yellow><max> <symbol></yellow>). Transfer cancelled."

  eco.give: "<green>Gave <yellow><amount></yellow> to <yellow><target></yellow>. New balance: <yellow><balance>"
  eco.take: "<green>Took <yellow><amount></yellow> from <yellow><target></yellow>. New balance: <yellow><balance>"
  eco.take-insufficient: "<red>Player has insufficient funds. Balance: <yellow><balance>"
  eco.set: "<green>Balance of <yellow><target></yellow> set to <yellow><balance>"
  eco.reset: "<green>Balance of <yellow><target></yellow> has been reset."

  abbrev.k: "k"
  abbrev.m: "M"
  abbrev.b: "B"

  notify.pay.sent-title: "<gold>💸 Payment sent"
  notify.pay.label-target: "<gray>  To"
  notify.pay.received-title: "<green>💰 Payment received"
  notify.pay.received-subtitle: "<gray>+<amount> <symbol> from <sender>"
