name: TerrCraftEconomy
version: '${version}'
main: ru.terracraft.economy.TerrEconomyPlugin
api-version: '26.3'
java-version: '25'
authors: [ luci ]
description: Экономический плагин для сервера TerrCraft
website: terra-craft.ru

dependencies:
  server:
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
    CommandAPI:
      load: BEFORE
      required: true
      join-classpath: true
    MineSQL:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false

permissions:
  terracraft.economy.admin:
    description: "Доступ к админ-командам экономики (/eco)"
    default: op